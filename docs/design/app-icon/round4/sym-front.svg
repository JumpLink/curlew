<!--
sym-front – the frontal bird, and the honest answer is that it does not hold at 16 px. Three
ways were tried: the bill as a white groove down the breast (closes up), as a white channel with
a black core (reads as a bib), and swinging clear of the flank (below). Head on, the one feature
that names a curlew is pointing at the viewer, and a single colour has nothing left to show it
with. This is the best of the three: a bird, but not recognisably this bird.
-->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <g fill="#222222">
    <path d="M8 5.6 C11.4 5.6 13.6 8.2 13.6 10.8 C13.6 12.5 12.4 13.4 10.6 13.4 H5.4
             C3.6 13.4 2.4 12.5 2.4 10.8 C2.4 8.2 4.6 5.6 8 5.6 Z"/>
    <path fill-rule="evenodd"
          d="M8 0.8 C10.1 0.8 11.8 2.5 11.8 4.6 C11.8 6.7 10.1 8.4 8 8.4
             C5.9 8.4 4.2 6.7 4.2 4.6 C4.2 2.5 5.9 0.8 8 0.8 Z
             M6.2 3.2 A1.25 1.25 0 1 0 6.2 5.7 A1.25 1.25 0 1 0 6.2 3.2 Z
             M9.8 3.2 A1.25 1.25 0 1 0 9.8 5.7 A1.25 1.25 0 1 0 9.8 3.2 Z"/>
    <g stroke="#222222" stroke-width="1" stroke-linecap="round">
      <path d="M6.5 13.2 V15.3"/>
      <path d="M9.5 13.2 V15.3"/>
    </g>
  </g>
  <path fill="#222222"
        d="M7.2 5.2 C6.9 8.4 8 11.2 10.2 12.8 C11.1 13.5 12.2 13.9 13.4 13.9
           C12.6 13.1 11.9 12.4 11.4 11.6 C10.4 10 9.9 7.6 10.1 5.2 Z"/>
</svg>
