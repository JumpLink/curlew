    <path fill-rule="evenodd"
          d="M4.6 1.4 H8.4 C10.2 1.4 11.6 2.8 11.6 4.6 V7.8
             C11.6 9.6 10.2 11 8.4 11 H4.6 C2.8 11 1.4 9.6 1.4 7.8 V4.6
             C1.4 2.8 2.8 1.4 4.6 1.4 Z
             M8.5 3.6 C7.9 3.6 7.4 4.1 7.4 4.7 C7.4 5.3 7.9 5.8 8.5 5.8
             C9.1 5.8 9.6 5.3 9.6 4.7 C9.6 4.1 9.1 3.6 8.5 3.6 Z"/>
