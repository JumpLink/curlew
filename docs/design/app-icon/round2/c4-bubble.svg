<?xml version="1.0" encoding="UTF-8"?>
<!--
C4 — one plain speech bubble, the same form Flare and Fractal both use, with the curlew head
painted on it and the bill breaking out through the lower right. The bubble says messenger
without a word of text; the bill crossing the edge is what keeps it from looking like a sticker
and what stops the silhouette from being just another chat icon. Natural colours.
-->
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bub" x1="0" y1="8" x2="0" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8ecd2"/>
      <stop offset="0.6" stop-color="#e6cfa6"/>
      <stop offset="1" stop-color="#c7a675"/>
    </linearGradient>
    <linearGradient id="bird" x1="0" y1="20" x2="0" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8d6139"/>
      <stop offset="1" stop-color="#523621"/>
    </linearGradient>
    <linearGradient id="bill" x1="74" y1="32" x2="118" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f4d2e"/>
      <stop offset="1" stop-color="#2f2114"/>
    </linearGradient>

    <path id="bubble4"
          d="M30 8 H98 C110 8 120 18 120 30 V68 C120 80 110 90 98 90 H52
             L24 118 L30 90 C18 89 8 80 8 68 V30 C8 18 18 8 30 8 Z"/>
    <clipPath id="bubble4-clip"><use href="#bubble4"/></clipPath>
  </defs>

  <use href="#bubble4" fill="url(#bub)"/>

  <!-- head and neck, painted on the bubble and clipped to it -->
  <g clip-path="url(#bubble4-clip)">
    <path fill="url(#bird)" d="M48 56 C43 72 43 86 46 102 L78 102 C73 86 73 70 80 58 Z"/>
    <ellipse cx="60" cy="44" rx="23" ry="21" fill="url(#bird)"/>
    <!-- the pale stripe over the eye, the one marking that survives the small sizes -->
    <path fill="#e6cfa6" opacity="0.5" d="M39 42 C51 32 74 32 83 39 L82 43 C70 37 51 37 39 47 Z"/>
  </g>

  <!-- the bill breaks out of the bubble -->
  <path fill="url(#bill)"
        d="M80 30 C99 39 114 61 122 98 L114 100 C105 68 93 47 77 41 Z"/>

  <circle cx="71" cy="38" r="5.6" fill="#f8ecd2"/>
  <circle cx="71.8" cy="38" r="2.9" fill="#241f31"/>
</svg>
