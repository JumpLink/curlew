<?xml version="1.0" encoding="UTF-8"?>
<!--
C6 — the several networks curlew folds into one list, as three overlapping bubbles. The head
sits low at the left and the raised bill runs up the diagonal to meet the front bubble's tail,
so the stack reads as what this bird is saying rather than as clipart parked beside it. Natural
colours: the bubbles take sand, sage and clay rather than the GNOME accents, so the whole icon
stays inside the bird's own palette.
-->
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="buff" x1="4" y1="70" x2="34" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e8c8"/>
      <stop offset="0.55" stop-color="#e2c091"/>
      <stop offset="1" stop-color="#b0804f"/>
    </linearGradient>
    <linearGradient id="bill" x1="50" y1="92" x2="90" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f4d2e"/>
      <stop offset="1" stop-color="#3a2817"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="10" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ec3cd"/><stop offset="1" stop-color="#4e8b9b"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="40" x2="0" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d3dfab"/><stop offset="1" stop-color="#8fa864"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="6" x2="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0d2b6"/><stop offset="1" stop-color="#bd8460"/>
    </linearGradient>

    <path id="neck6" d="M12 112 C6 120 5 126 6 128 L40 128 C37 122 38 116 42 110 Z"/>
    <clipPath id="neck6-clip"><use href="#neck6"/></clipPath>
    <ellipse id="head6" cx="30" cy="96" rx="26" ry="23"/>
    <clipPath id="head6-clip"><use href="#head6"/></clipPath>
  </defs>

  <!-- three bubbles, back to front; the front one's tail reaches down to the bill -->
  <rect x="56" y="10" width="34" height="26" rx="10" fill="url(#b1)"/>
  <rect x="98" y="40" width="26" height="22" rx="9"  fill="url(#b2)"/>
  <path fill="url(#b3)"
        d="M82 6 H112 C119 6 124 11 124 18 V32 C124 39 119 44 112 44 H96
           L84 54 L90 44 H82 C75 44 70 39 70 32 V18 C70 11 75 6 82 6 Z"/>

  <use href="#neck6" fill="url(#buff)"/>
  <g clip-path="url(#neck6-clip)" fill="#9a6c42" opacity="0.4">
    <path d="M14 116 l5 2 -4 8 -5 -2 Z"/>
    <path d="M28 118 l5 2 -3 6 -5 -2 Z"/>
  </g>

  <use href="#head6" fill="url(#buff)"/>
  <g clip-path="url(#head6-clip)">
    <path fill="#a97a4e" d="M4 86 C11 73 26 67 40 71 C52 74 58 81 58 88 C42 77 16 76 4 86 Z"/>
    <path fill="#fbf0d8" opacity="0.8" d="M6 93 C20 80 46 81 58 89 L57 94 C42 85 19 86 6 99 Z"/>
  </g>

  <!-- the bill, raised up the diagonal to where the front bubble's tail comes down -->
  <path fill="url(#bill)" d="M50 84 C64 80 76 70 84 54 L91 59 C82 77 68 88 52 92 Z"/>

  <circle cx="42" cy="86" r="6.4" fill="#241f31"/>
  <circle cx="44.2" cy="83.8" r="2" fill="#ffffff" opacity="0.85"/>
</svg>
