<?xml version="1.0" encoding="UTF-8"?>
<!-- Symbolic candidate 1: head, neck and bill. The eye is a hole, which is the single mark that
     turns the curve from a hook into a bird at 16 px. -->
<svg width="16" height="16" viewBox="0 0 16 16" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <g fill="#222222">
    <path d="M3.3 7.6 C2.7 10 2.6 13.1 3.0 16 L6.3 16 C5.8 13.1 5.9 10.3 6.5 8.2 Z"/>
    <!-- the bill leaves the face at eye level and stays near level before it decurves, which is
         what keeps it a curlew rather than a hook -->
    <path d="M9.0 3.3 C12.3 4.1 14.4 7.6 14.9 13.2 L13.1 13.4 C12.6 8.6 11.0 5.9 8.6 5.2 Z"/>
    <path fill-rule="evenodd"
          d="M5.4 1.1 C7.7 1.1 9.5 2.8 9.5 5.0 C9.5 7.2 7.7 8.9 5.4 8.9
             C3.2 8.9 1.3 7.2 1.3 5.0 C1.3 2.8 3.2 1.1 5.4 1.1 Z
             M7.1 3.2 C6.5 3.2 6.0 3.7 6.0 4.3 C6.0 4.9 6.5 5.4 7.1 5.4
             C7.7 5.4 8.2 4.9 8.2 4.3 C8.2 3.7 7.7 3.2 7.1 3.2 Z"/>
  </g>
</svg>
