<?xml version="1.0" encoding="UTF-8"?>
<!--
C5, bubble variant: the same calling head, but what leaves the open bill is a speech bubble
instead of sound arcs, in GNOME blue. The call becomes a message, which is the one step the
arcs do not take on their own — and the bubble's tail points back down the bill, so the two
halves read as one action.
-->
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="buff" x1="6" y1="48" x2="36" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e8c8"/>
      <stop offset="0.55" stop-color="#e2c091"/>
      <stop offset="1" stop-color="#b0804f"/>
    </linearGradient>
    <linearGradient id="bill" x1="58" y1="70" x2="100" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f4d2e"/>
      <stop offset="0.55" stop-color="#4a3420"/>
      <stop offset="1" stop-color="#332315"/>
    </linearGradient>
    <linearGradient id="bub" x1="0" y1="2" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#99c1f1"/>
      <stop offset="0.55" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>

    <path id="neck5b" d="M20 90 C10 108 8 122 11 128 L48 128 C44 112 46 98 54 88 Z"/>
    <clipPath id="neck5b-clip"><use href="#neck5b"/></clipPath>
    <ellipse id="head5b" cx="40" cy="74" rx="26" ry="24"/>
    <clipPath id="head5b-clip"><use href="#head5b"/></clipPath>
  </defs>

  <!-- the message, leaving the tip of the bill; its tail points back down the bill -->
  <path fill="url(#bub)"
        d="M92 4 H110 C120 4 126 11 126 21 V32 C126 42 120 49 110 49 H98
           L86 58 L92 49 C82 49 76 42 76 32 V21 C76 11 82 4 92 4 Z"/>

  <use href="#neck5b" fill="url(#buff)"/>
  <g clip-path="url(#neck5b-clip)" fill="#9a6c42" opacity="0.4">
    <path d="M22 96 l5 2 -5 11 -5 -2 Z"/>
    <path d="M38 98 l5 2 -5 11 -5 -2 Z"/>
    <path d="M18 118 l5 2 -4 8 -5 -2 Z"/>
    <path d="M34 120 l5 2 -3 6 -5 -2 Z"/>
  </g>

  <use href="#head5b" fill="url(#buff)"/>
  <g clip-path="url(#head5b-clip)">
    <path fill="#a97a4e" d="M12 64 C19 51 34 45 48 49 C60 52 66 59 66 66 C50 55 24 54 12 64 Z"/>
    <path fill="#fbf0d8" opacity="0.8" d="M14 71 C28 58 54 59 66 67 L65 72 C50 63 27 64 14 77 Z"/>
  </g>

  <path fill="url(#bill)" d="M59 58 C76 55 89 46 98 30 L104 36 C95 54 81 64 61 68 Z"/>
  <path fill="#5a3f26"   d="M60 68 C76 65 88 56 96 42 L99 48 C91 63 78 72 62 76 Z"/>

  <circle cx="52" cy="62" r="6.4" fill="#241f31"/>
  <circle cx="54.2" cy="59.8" r="2" fill="#ffffff" opacity="0.85"/>
</svg>
