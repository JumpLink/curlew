<?xml version="1.0" encoding="UTF-8"?>
<!--
C2 — the same anatomy as C1 in a different pose and perspective: the bird leaning forward in
three-quarter view, probing the mudflat. The body is tipped so the tail point rides high at the
upper left and the breast drops to the right, the neck stretches forward out of the shoulders,
and the bill drives down into the sand until the tip disappears into it. Both legs show, one
forward and one back, which is what sells the stride and the three-quarter view.
-->
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="buff" x1="0" y1="40" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6e2bd"/>
      <stop offset="0.55" stop-color="#e2c091"/>
      <stop offset="1" stop-color="#bd8f62"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="40" x2="0" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b07d46"/>
      <stop offset="1" stop-color="#6b4a2c"/>
    </linearGradient>
    <linearGradient id="bill" x1="100" y1="46" x2="112" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b4a2c"/>
      <stop offset="0.5" stop-color="#4a3420"/>
      <stop offset="1" stop-color="#372618"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="110" x2="0" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e7d6b2"/>
      <stop offset="1" stop-color="#c2ab82"/>
    </linearGradient>

    <path id="body"
          d="M74 68 C76 79 68 87 54 88 C40 89 24 86 15 78
             C10 74 6 71 4 68 C16 58 41 53 58 55 C68 56 73 61 74 68 Z"/>
    <clipPath id="body-clip"><use href="#body"/></clipPath>
    <path id="neck2" d="M56 76 C58 58 70 44 90 42 L92 53 C78 55 69 65 67 80 Z"/>
    <clipPath id="neck2-clip"><use href="#neck2"/></clipPath>
  </defs>

  <!-- mudflat -->
  <ellipse cx="64" cy="120" rx="57" ry="7" fill="#9c8a66"/>
  <ellipse cx="64" cy="116" rx="57" ry="7" fill="url(#sand)"/>

  <!-- far leg, trailing behind -->
  <g fill="none" stroke="#908f94" stroke-linecap="round">
    <path stroke-width="4.2" d="M58 80 L66 97 L60 114"/>
    <path stroke-width="3.2" d="M60 114 L71 116"/>
  </g>

  <!-- body, tipped forward: tail point high at the left, breast low at the right -->
  <g transform="rotate(14 40 70)">
    <use href="#body" fill="url(#buff)"/>
    <path clip-path="url(#body-clip)" fill="url(#wing)"
          d="M3 68 C16 57 41 52 58 54 C68 55 73 60 74 67
             C68 69 67 63 61 64 C55 65 54 60 48 61 C42 62 41 57 35 58
             C29 59 28 55 22 56 C16 57 9 63 4 63 Z"/>
    <path clip-path="url(#body-clip)" fill="#5e4127"
          d="M4 68 C3 63 5 58 9 55 L16 60 C11 64 9 69 9 76 Z"/>
  </g>

  <!-- near leg, striding forward -->
  <g fill="none" stroke="#6f6d74" stroke-linecap="round">
    <path stroke-width="4.6" d="M44 86 L36 101 L44 114"/>
    <path stroke-width="3.6" d="M44 114 L55 116"/>
  </g>

  <!-- neck, stretched forward out of the shoulders -->
  <use href="#neck2" fill="url(#buff)"/>
  <g clip-path="url(#neck2-clip)" fill="#9a6c42" opacity="0.5">
    <path d="M64 64 l6 1 -2 6 -6 -1 Z"/>
    <path d="M76 56 l6 1 -2 6 -6 -1 Z"/>
    <path d="M60 73 l5 1 -2 5 -5 -1 Z"/>
  </g>

  <!-- head -->
  <ellipse cx="97" cy="47" rx="9.4" ry="8.6" fill="url(#buff)"/>
  <path fill="#a97a4e" d="M88 43 C89.5 37 93 34 98 34.5 C103.5 35 107 38.5 106.6 44 C101 39.6 92.6 39 88 43 Z"/>

  <!-- the bill, sweeping down into the sand in one long decurve -->
  <path fill="url(#bill)"
        d="M103 40 C118 50 124 78 119 111 L112 110 C116 80 110 57 100.5 49 Z"/>

  <circle cx="99" cy="45" r="3.6" fill="#241f31"/>
  <circle cx="100.2" cy="43.8" r="1.1" fill="#ffffff" opacity="0.85"/>

  <!-- the dimple the bill makes in the wet sand -->
  <ellipse cx="116" cy="112" rx="8" ry="2.6" fill="#ffffff" opacity="0.45"/>
</svg>
