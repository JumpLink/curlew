<?xml version="1.0" encoding="UTF-8"?>
<!--
C5 — the call. A curlew's call carries a kilometre across a mudflat, which is the whole idea
behind the app's name, so the head is thrown back and the bill raised and open, with the sound
spreading from the tip. Drawn at portrait scale like C3, not as a small bird in a corner: the
head fills the lower left, the gape between the two mandibles is what says calling rather than
pointing, and the bill keeps its decurve even raised.
-->
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="buff" x1="6" y1="48" x2="36" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e8c8"/>
      <stop offset="0.55" stop-color="#e2c091"/>
      <stop offset="1" stop-color="#b0804f"/>
    </linearGradient>
    <linearGradient id="bill" x1="58" y1="70" x2="106" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f4d2e"/>
      <stop offset="0.55" stop-color="#4a3420"/>
      <stop offset="1" stop-color="#332315"/>
    </linearGradient>

    <path id="neck5" d="M20 90 C10 108 8 122 11 128 L48 128 C44 112 46 98 54 88 Z"/>
    <clipPath id="neck5-clip"><use href="#neck5"/></clipPath>
    <ellipse id="head5" cx="40" cy="74" rx="26" ry="24"/>
    <clipPath id="head5-clip"><use href="#head5"/></clipPath>
  </defs>

  <!-- the call, spreading from the tip of the bill -->
  <g fill="none" stroke="#e5a50a" stroke-linecap="round">
    <path stroke-width="7"                  d="M108 16 A13 13 0 0 1 114 34"/>
    <path stroke-width="6" opacity="0.72"   d="M113 7  A23 23 0 0 1 122 38"/>
  </g>

  <!-- neck, running off the bottom edge, streaked -->
  <use href="#neck5" fill="url(#buff)"/>
  <g clip-path="url(#neck5-clip)" fill="#9a6c42" opacity="0.4">
    <path d="M22 96 l5 2 -5 11 -5 -2 Z"/>
    <path d="M38 98 l5 2 -5 11 -5 -2 Z"/>
    <path d="M18 118 l5 2 -4 8 -5 -2 Z"/>
    <path d="M34 120 l5 2 -3 6 -5 -2 Z"/>
  </g>

  <!-- head, tilted back -->
  <use href="#head5" fill="url(#buff)"/>
  <g clip-path="url(#head5-clip)">
    <path fill="#a97a4e" d="M12 64 C19 51 34 45 48 49 C60 52 66 59 66 66 C50 55 24 54 12 64 Z"/>
    <path fill="#fbf0d8" opacity="0.8" d="M14 71 C28 58 54 59 66 67 L65 72 C50 63 27 64 14 77 Z"/>
  </g>

  <!-- the bill, raised and open: the two mandibles hinge at the face and part toward the tip,
       so the gape between them is what says calling rather than pointing -->
  <path fill="url(#bill)" d="M56 54 C74 52 90 40 99 20 L106 26 C96 48 76 64 58 66 Z"/>
  <path fill="#5a3f26"    d="M58 66 C72 65 85 58 93 46 L97 53 C88 68 73 76 59 78 Z"/>

  <circle cx="52" cy="62" r="6.4" fill="#241f31"/>
  <circle cx="54.2" cy="59.8" r="2" fill="#ffffff" opacity="0.85"/>
</svg>
