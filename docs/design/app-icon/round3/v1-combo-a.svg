<?xml version="1.0" encoding="UTF-8"?>
<!--
V1 — Combo A: the round-2 orange bubble with the round-2 portrait head painted on it, the bill
breaking out through the lower right.

The head is the light, streaked, supercilium-marked one from C3, not C4b's dark silhouette: a
black head on orange read as a penguin, while the buff one with its dark crown and pale eye
stripe can only be a wader. The bubble's tail sits at the far bottom left so it never runs into
the neck — when the two met, the bottom of the icon read as a notch.
-->
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bub" x1="0" y1="6" x2="0" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd396"/>
      <stop offset="0.55" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#ff7800"/>
    </linearGradient>
    <linearGradient id="buff" x1="24" y1="14" x2="70" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e8c8"/>
      <stop offset="0.55" stop-color="#e2c091"/>
      <stop offset="1" stop-color="#b0804f"/>
    </linearGradient>
    <linearGradient id="bill" x1="80" y1="26" x2="120" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f4d2e"/>
      <stop offset="0.5" stop-color="#4a3420"/>
      <stop offset="1" stop-color="#332315"/>
    </linearGradient>

    <path id="bubble"
          d="M30 6 H98 C110 6 120 16 120 28 V66 C120 78 110 88 98 88 H40
             L12 116 L22 88 C12 85 8 77 8 66 V28 C8 16 18 6 30 6 Z"/>
    <clipPath id="bubble-clip"><use href="#bubble"/></clipPath>
    <ellipse id="head" cx="54" cy="42" rx="32" ry="28"/>
    <clipPath id="head-clip"><use href="#head"/></clipPath>
  </defs>

  <use href="#bubble" fill="url(#bub)"/>

  <g clip-path="url(#bubble-clip)">
    <!-- neck, running down to the bubble's lower edge, clear of the tail -->
    <path fill="url(#buff)" d="M44 64 C38 76 37 84 38 92 L76 92 C74 82 76 72 82 62 Z"/>
    <g fill="#9a6c42" opacity="0.3">
      <path d="M46 68 l3 1 -4 14 -3 -1 Z"/>
      <path d="M56 69 l3 1 -4 14 -3 -1 Z"/>
      <path d="M66 69 l3 1 -4 14 -3 -1 Z"/>
    </g>

    <use href="#head" fill="url(#buff)"/>
    <g clip-path="url(#head-clip)">
      <!-- the dark crown and the pale stripe over the eye: the two marks that say curlew -->
      <path fill="#8a5f3a" d="M20 36 C26 20 40 12 55 12 C72 12 83 19 87 31 C67 18 35 21 20 36 Z"/>
      <path fill="#fbf0d8" opacity="0.55" d="M22 41 C39 28 70 28 87 35 L87 39 C67 31 38 34 23 46 Z"/>
    </g>
  </g>

  <!-- the bill breaks out through the lower right edge of the bubble -->
  <path fill="url(#bill)"
        d="M80 28 C105 38 121 64 124 114 L115 116 C112 74 97 47 77 41 Z"/>

  <circle cx="70" cy="35" r="6.6" fill="#241f31"/>
  <circle cx="72.2" cy="32.8" r="2" fill="#ffffff" opacity="0.85"/>
</svg>
