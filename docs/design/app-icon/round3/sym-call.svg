<?xml version="1.0" encoding="UTF-8"?>
<!--
Symbolic 2 — the calling pose, for the case a V4-style icon wins: head thrown back at the lower
left, bill raised across the diagonal, and the message at the top right.

Only two masses. Round 2 dropped a calling symbolic because three separate bits — head, bill,
sound — turned into gravel at 16 px, so here the bill runs straight into the bubble and the whole
icon is one connected silhouette: a bird at one end, a message at the other, nothing floating.
-->
<svg width="16" height="16" viewBox="0 0 16 16" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <g fill="#222222">
    <!-- neck, descending forward and to the right out of the bottom edge -->
    <path d="M1.2 11.6 C0.6 13.6 1.3 16 2.5 16 L7.0 16 C5.6 14.8 5.0 13.4 5.2 11.8 Z"/>
    <!-- head, smaller than the bill is long, so the bill stays the feature that names the bird -->
    <path fill-rule="evenodd"
          d="M4.1 7.9 C6.0 7.9 7.6 9.4 7.6 11.2 C7.6 13.1 6.0 14.5 4.1 14.5
             C2.2 14.5 0.6 13.1 0.6 11.2 C0.6 9.4 2.2 7.9 4.1 7.9 Z
             M5.7 9.6 C5.1 9.6 4.7 10.1 4.7 10.6 C4.7 11.2 5.1 11.6 5.7 11.6
             C6.2 11.6 6.7 11.2 6.7 10.6 C6.7 10.1 6.2 9.6 5.7 9.6 Z"/>
    <!-- the raised bill: steep out of the gape, flattening toward the tip, running on into the
         message so the two never read as loose pieces -->
    <path d="M6.0 9.2 C8.2 5.8 10.2 3.9 12.4 2.9 L13.2 4.6 C11.4 5.5 9.6 7.2 7.8 10.2 Z"/>
    <rect x="10.8" y="0.2" width="4.9" height="5.0" rx="1.6"/>
  </g>
</svg>
