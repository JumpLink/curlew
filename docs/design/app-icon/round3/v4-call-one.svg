<?xml version="1.0" encoding="UTF-8"?>
<!--
V4 — the call, with one bubble. The curlew is named after its call, and a call is what a
messenger is for, so the whole icon is one bird in the act of calling: head thrown back, bill
raised and parted, the message coming out of it.

Three things make the posture read. The head is large and cropped by the lower left corner, so
it is a portrait like C3 rather than a small bird parked in a corner. The neck descends forward
and to the right while the head leans back over it, which is the counter-curve a real curlew
makes when it calls — a neck straight under the head only ever looked like a ball on a stick.
And the bill leaves the FACE at eye level: because the bill is decurved, throwing the head back
makes it rise steeply at the base and flatten toward the tip, and that single curve is what
stops a raised bill from reading as a spike.
-->
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="buff" x1="0" y1="64" x2="60" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e8c8"/>
      <stop offset="0.55" stop-color="#e2c091"/>
      <stop offset="1" stop-color="#b0804f"/>
    </linearGradient>
    <linearGradient id="bill" x1="46" y1="82" x2="100" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f4d2e"/>
      <stop offset="0.55" stop-color="#4a3420"/>
      <stop offset="1" stop-color="#332315"/>
    </linearGradient>
    <linearGradient id="bub" x1="0" y1="2" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd396"/>
      <stop offset="0.55" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#ff7800"/>
    </linearGradient>

    <path id="neckC" d="M4 98 C0 116 10 128 24 128 L70 128 C52 123 42 110 44 92 Z"/>
    <clipPath id="neckC-clip"><use href="#neckC"/></clipPath>
    <clipPath id="headC-clip"><ellipse cx="28" cy="92" rx="29" ry="25"/></clipPath>
  </defs>

  <g id="zoom" transform="translate(-10 -2) scale(1.09)">

  <!-- the message, behind the bird, so the raised bill lands on it rather than beside it;
       its tail points away to the lower right, clear of the bill and the neck -->
  <path fill="url(#bub)"
        d="M82 2 H110 C119 2 126 9 126 18 V40 C126 49 119 56 110 56 H104
           L100 76 L90 56 H82 C73 56 66 49 66 40 V18 C66 9 73 2 82 2 Z"/>

  <use href="#neckC" fill="url(#buff)"/>
  <g clip-path="url(#neckC-clip)" fill="#9a6c42" opacity="0.3">
    <path d="M12 108 l3 1 -6 15 -3 -1 Z"/>
    <path d="M26 116 l3 1 -4 12 -3 -1 Z"/>
    <path d="M40 120 l3 1 -3 8 -3 -1 Z"/>
  </g>

  <!-- the head, thrown back; crown, eye stripe and eye all turn with it -->
  <g transform="rotate(-24 28 92)">
    <ellipse cx="28" cy="92" rx="29" ry="25" fill="url(#buff)"/>
    <g clip-path="url(#headC-clip)">
      <path fill="#8a5f3a" d="M-2 86 C4 70 15 63 28 63 C44 63 55 70 59 81 C40 68 11 71 -2 86 Z"/>
      <path fill="#fbf0d8" opacity="0.6" d="M0 91 C16 78 46 78 59 85 L59 89 C42 81 14 84 1 96 Z"/>
    </g>
    <circle cx="46" cy="84" r="6.3" fill="#241f31"/>
    <circle cx="48.2" cy="81.8" r="2" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- the bill, raised and parted: upper mandible, then the lower one dropping away from it -->
  <path fill="url(#bill)" d="M46 66 C64 50 80 38 97 31 L100 38 C85 45 70 56 56 75 Z"/>
  <path fill="#5a3f26"   d="M52 77 C67 58 81 47 95 41 L97 46 C84 52 71 62 59 85 Z"/>
  </g>
</svg>
