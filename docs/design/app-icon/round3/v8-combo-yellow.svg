<?xml version="1.0" encoding="UTF-8"?>
<!--
V8 — Combo B in GNOME yellow. The bird-in-front composition of V2, on the brightest ground in
the palette: yellow gives the buff head less contrast than red does but far more presence in a
dark sidebar, and it is the one warm hue no other GNOME messenger has taken.
-->
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bub" x1="0" y1="12" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9f06b"/>
      <stop offset="0.5" stop-color="#f8e45c"/>
      <stop offset="1" stop-color="#e5a50a"/>
    </linearGradient>
    <linearGradient id="buff" x1="8" y1="28" x2="56" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e8c8"/>
      <stop offset="0.55" stop-color="#dcb983"/>
      <stop offset="1" stop-color="#a0713f"/>
    </linearGradient>
    <linearGradient id="bill" x1="70" y1="42" x2="118" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f4d2e"/>
      <stop offset="0.5" stop-color="#4a3420"/>
      <stop offset="1" stop-color="#332315"/>
    </linearGradient>

    <ellipse id="head8" cx="40" cy="56" rx="32" ry="28"/>
    <clipPath id="head8-clip"><use href="#head8"/></clipPath>
  </defs>

  <path fill="url(#bub)"
        d="M46 12 H102 C114 12 124 22 124 34 V74 C124 86 114 96 102 96 H92
           L112 120 L76 96 H46 C34 96 24 86 24 74 V34 C24 22 34 12 46 12 Z"/>

  <path fill="url(#buff)" d="M26 78 C18 96 16 114 20 128 L54 128 C50 112 52 94 60 80 Z"/>
  <g fill="#9a6c42" opacity="0.3">
    <path d="M28 86 l3 1 -5 16 -3 -1 Z"/>
    <path d="M40 87 l3 1 -5 16 -3 -1 Z"/>
    <path d="M24 110 l3 1 -4 14 -3 -1 Z"/>
    <path d="M36 112 l3 1 -4 14 -3 -1 Z"/>
  </g>

  <use href="#head8" fill="url(#buff)"/>
  <g clip-path="url(#head8-clip)">
    <path fill="#8a5f3a" d="M6 50 C12 34 26 26 41 26 C58 26 69 33 73 45 C53 32 21 35 6 50 Z"/>
    <path fill="#fbf0d8" opacity="0.55" d="M8 55 C25 42 56 42 73 49 L73 53 C53 45 24 48 9 60 Z"/>
  </g>

  <path fill="url(#bill)"
        d="M66 42 C92 51 112 76 121 112 L113 114 C103 82 85 60 63 55 Z"/>

  <circle cx="56" cy="49" r="6.6" fill="#241f31"/>
  <circle cx="58.2" cy="46.8" r="2" fill="#ffffff" opacity="0.85"/>
</svg>
