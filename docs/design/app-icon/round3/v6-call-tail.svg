<?xml version="1.0" encoding="UTF-8"?>
<!--
V6 — the call, with the bill as the bubble's tail. Bird and message are one connected line: the
raised bill does not stop at a tip and hand over to a separate pointer, it runs on and widens
into the bubble, so the message is literally what the bird is producing.

The join is made by continuing the bill's own curve in orange — the tail leaves the bubble on
the same arc the bill arrives on, and the bill's tip is drawn under it, so the eye reads one
sweep from the gape to the message rather than a balloon on a string.
-->
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="buff" x1="0" y1="64" x2="60" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e8c8"/>
      <stop offset="0.55" stop-color="#e2c091"/>
      <stop offset="1" stop-color="#b0804f"/>
    </linearGradient>
    <linearGradient id="bill" x1="46" y1="82" x2="92" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f4d2e"/>
      <stop offset="0.55" stop-color="#4a3420"/>
      <stop offset="1" stop-color="#332315"/>
    </linearGradient>
    <linearGradient id="bub" x1="0" y1="2" x2="0" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd396"/>
      <stop offset="0.55" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#ff7800"/>
    </linearGradient>

    <path id="neckC" d="M4 98 C0 116 10 128 24 128 L70 128 C52 123 42 110 44 92 Z"/>
    <clipPath id="neckC-clip"><use href="#neckC"/></clipPath>
    <clipPath id="headC-clip"><ellipse cx="28" cy="92" rx="29" ry="25"/></clipPath>
  </defs>

  <g id="zoom" transform="translate(-10 -2) scale(1.09)">

  <use href="#neckC" fill="url(#buff)"/>
  <g clip-path="url(#neckC-clip)" fill="#9a6c42" opacity="0.3">
    <path d="M12 108 l3 1 -6 15 -3 -1 Z"/>
    <path d="M26 116 l3 1 -4 12 -3 -1 Z"/>
    <path d="M40 120 l3 1 -3 8 -3 -1 Z"/>
  </g>

  <g transform="rotate(-24 28 92)">
    <ellipse cx="28" cy="92" rx="29" ry="25" fill="url(#buff)"/>
    <g clip-path="url(#headC-clip)">
      <path fill="#8a5f3a" d="M-2 86 C4 70 15 63 28 63 C44 63 55 70 59 81 C40 68 11 71 -2 86 Z"/>
      <path fill="#fbf0d8" opacity="0.6" d="M0 91 C16 78 46 78 59 85 L59 89 C42 81 14 84 1 96 Z"/>
    </g>
    <circle cx="46" cy="84" r="6.3" fill="#241f31"/>
    <circle cx="48.2" cy="81.8" r="2" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- the bill: shorter than in V4, because the last stretch of the sweep is the bubble's tail -->
  <path fill="url(#bill)" d="M46 66 C57 55 64 50 73 45 L76 53 C66 57 60 62 56 75 Z"/>
  <path fill="#5a3f26"   d="M52 77 C61 65 68 58 76 54 L78 59 C69 63 64 69 58 85 Z"/>

  <!-- the message: its tail picks the bill's curve up where the horn ends and carries it on,
       so bird and bubble share one line instead of being joined by a pointer -->
  <path fill="url(#bub)"
        d="M68 46 C78 38 88 33 98 29 L98 62 C86 62 76 56 68 52 Z"/>
  <rect x="84" y="4" width="42" height="54" rx="15" fill="url(#bub)"/>
  </g>
</svg>
