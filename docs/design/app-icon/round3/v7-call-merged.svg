<?xml version="1.0" encoding="UTF-8"?>
<!--
V7 — the call, with two bubbles merged into one outline. Where V5 keeps three separate messages,
these two overlap so far that they share a silhouette: at 128 px you read two messages in two
hues, at 32 px you read one clean rounded shape with a tail. That is how a busy icon should
behave as it shrinks — simplify, not disintegrate.

Both hues are warm (yellow behind, orange in front) so the merged outline stays one object; two
distant hues would have split it back into two stickers.
-->
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="buff" x1="0" y1="64" x2="60" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e8c8"/>
      <stop offset="0.55" stop-color="#e2c091"/>
      <stop offset="1" stop-color="#b0804f"/>
    </linearGradient>
    <linearGradient id="bill" x1="46" y1="82" x2="100" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f4d2e"/>
      <stop offset="0.55" stop-color="#4a3420"/>
      <stop offset="1" stop-color="#332315"/>
    </linearGradient>
    <linearGradient id="b-back" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9f06b"/><stop offset="1" stop-color="#e5a50a"/>
    </linearGradient>
    <linearGradient id="b-front" x1="0" y1="12" x2="0" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd396"/>
      <stop offset="0.55" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#ff7800"/>
    </linearGradient>

    <path id="neckC" d="M4 98 C0 116 10 128 24 128 L70 128 C52 123 42 110 44 92 Z"/>
    <clipPath id="neckC-clip"><use href="#neckC"/></clipPath>
    <clipPath id="headC-clip"><ellipse cx="28" cy="92" rx="29" ry="25"/></clipPath>
  </defs>

  <g id="zoom" transform="translate(-10 -2) scale(1.09)">

  <!-- the two messages, overlapping into a single outline -->
  <rect x="58" y="2" width="52" height="38" rx="15" fill="url(#b-back)"/>
  <path fill="url(#b-front)"
        d="M86 16 H112 C120 16 126 22 126 30 V50 C126 58 120 64 112 64 H104
           L98 82 L90 64 H86 C78 64 72 58 72 50 V30 C72 22 78 16 86 16 Z"/>

  <use href="#neckC" fill="url(#buff)"/>
  <g clip-path="url(#neckC-clip)" fill="#9a6c42" opacity="0.3">
    <path d="M12 108 l3 1 -6 15 -3 -1 Z"/>
    <path d="M26 116 l3 1 -4 12 -3 -1 Z"/>
    <path d="M40 120 l3 1 -3 8 -3 -1 Z"/>
  </g>

  <g transform="rotate(-24 28 92)">
    <ellipse cx="28" cy="92" rx="29" ry="25" fill="url(#buff)"/>
    <g clip-path="url(#headC-clip)">
      <path fill="#8a5f3a" d="M-2 86 C4 70 15 63 28 63 C44 63 55 70 59 81 C40 68 11 71 -2 86 Z"/>
      <path fill="#fbf0d8" opacity="0.6" d="M0 91 C16 78 46 78 59 85 L59 89 C42 81 14 84 1 96 Z"/>
    </g>
    <circle cx="46" cy="84" r="6.3" fill="#241f31"/>
    <circle cx="48.2" cy="81.8" r="2" fill="#ffffff" opacity="0.85"/>
  </g>

  <path fill="url(#bill)" d="M46 66 C64 50 80 38 97 31 L100 38 C85 45 70 56 56 75 Z"/>
  <path fill="#5a3f26"   d="M52 77 C67 58 81 47 95 41 L97 46 C84 52 71 62 59 85 Z"/>
  </g>
</svg>
