<?xml version="1.0" encoding="UTF-8"?>
<!--
V9 – continuity with the shipped icon: the full-size shared bubble as the tile, the frontal
bird clipped into it and the bill, drawn outside the clip, breaking out over the right edge.
Legs off: inside a bubble they read as cracks.
-->
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="face" x1="48" y1="100" x2="80" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e01b24"/>
      <stop offset="1" stop-color="#f66151"/>
    </linearGradient>
    <linearGradient id="wall" x1="8" y1="70" x2="120" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c01c28"/>
      <stop offset="0.0714286" stop-color="#f66151"/>
      <stop offset="0.142857" stop-color="#c01c28"/>
      <stop offset="0.857143" stop-color="#c01c28"/>
      <stop offset="0.928571" stop-color="#f66151"/>
      <stop offset="1" stop-color="#c01c28"/>
    </linearGradient>
    <linearGradient id="fold" x1="31.462524" y1="114" x2="39" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c01c28"/>
      <stop offset="0.469318" stop-color="#f66151"/>
      <stop offset="1" stop-color="#c01c28"/>
    </linearGradient>
    <path id="tail" fill-rule="evenodd"
          d="M24 100 V112 H28 C30.210938 112 32 113.789062 32 116 V123
             C32 124.992188 33.183594 126.792969 35.011719 127.585938
             C36.839844 128.375 38.964844 128.003906 40.417969 126.640625
             L53.941406 113.933594 C55.265625 112.691406 57.011719 112 58.824219 112
             H68 V100 Z"/>
    <path id="lip" fill-rule="evenodd"
          d="M24 106 V108 H28 C30.210938 108 32 109.789062 32 112 V119
             C32 120.992188 33.183594 122.792969 35.011719 123.585938
             C36.839844 124.375 38.964844 124.003906 40.417969 122.640625
             L53.941406 109.933594 C55.265625 108.691406 57.011719 108 58.824219 108
             H68 V106 Z"/>
    <path id="wallrect"
          d="M24 28 H104 C112.835938 28 120 35.164062 120 44 V96
             C120 104.835938 112.835938 112 104 112 H24
             C15.164062 112 8 104.835938 8 96 V44 C8 35.164062 15.164062 28 24 28 Z"/>
    <path id="facerect"
          d="M24 24 H104 C112.835938 24 120 31.164062 120 40 V92
             C120 100.835938 112.835938 108 104 108 H24
             C15.164062 108 8 100.835938 8 92 V40 C8 31.164062 15.164062 24 24 24 Z"/>
    <clipPath id="face-clip"><use href="#facerect"/></clipPath>
    <linearGradient id="buff" x1="34" y1="20" x2="96" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e8c8"/>
      <stop offset="0.55" stop-color="#e2c091"/>
      <stop offset="1" stop-color="#b0804f"/>
    </linearGradient>
    <linearGradient id="breast" x1="42" y1="46" x2="92" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e8c8"/>
      <stop offset="0.55" stop-color="#e2c091"/>
      <stop offset="1" stop-color="#b0804f"/>
    </linearGradient>
    <linearGradient id="wing" x1="22" y1="52" x2="106" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dcb988"/>
      <stop offset="0.55" stop-color="#c49a68"/>
      <stop offset="1" stop-color="#a0743f"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bill" x1="54.0" y1="50.0" x2="93.0" y2="114.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a5533"/>
      <stop offset="0.45" stop-color="#4a3420"/>
      <stop offset="1" stop-color="#33230f"/>
    </linearGradient>
    <path id="bodyshape" d="M60 46 C86 46 98 67 98 86 C98 100 89 108 74 108 H46 C31 108 22 100 22 86 C22 67 34 46 60 46 Z"/>
    <clipPath id="body-clip"><use href="#bodyshape"/></clipPath>
  </defs>

  <use href="#tail" fill="url(#fold)"/>
  <use href="#wallrect" fill="url(#wall)"/>
  <use href="#facerect" fill="url(#face)"/>
  <use href="#lip" fill="#e01b24"/>
  <g clip-path="url(#face-clip)">
  <g transform="translate(-4,0.0) translate(64,74) scale(0.72) translate(-64,-72)">
  <!-- folded wings: the darker flanks a standing curlew shows either side of the breast -->
  <use href="#bodyshape" fill="url(#wing)"/>
  <path fill="url(#breast)" d="M60 53 C79 53 88 70 88 86 C88 97 81 103 70 103 H50
                               C39 103 32 97 32 86 C32 70 41 53 60 53 Z"/>
  <g fill="#9a6c42" opacity="0.34">
    <path d="M40 68 l3 1 l-3 24 l-3 -1 Z"/>
    <path d="M50 61 l3 1 l-3 34 l-3 -1 Z"/>
    <path d="M69 61 l3 1 l-2 34 l-3 -1 Z"/>
    <path d="M79 68 l3 1 l-1 22 l-3 -1 Z"/>
  </g>
  <!-- the top-lit sheen, clipped to the body: Pidgin's gloss, kept flat enough for GNOME -->
  <g clip-path="url(#body-clip)">
    <ellipse cx="54" cy="56" rx="32" ry="24" fill="url(#gloss)"/>
  </g>
  <g transform="rotate(-10 60 38)">
    <!-- the same ellipse 3 px lower, a crescent of shade that lifts the head off the back -->
    <ellipse cx="60" cy="39" rx="24" ry="22" fill="#8a5f3a" opacity="0.4"/>
    <ellipse cx="60" cy="36" rx="24" ry="22" fill="url(#buff)"/>
    <!-- dark crown with the pale central stripe a curlew has, and the supercilium
         over each eye: the marks that still say curlew when the bill foreshortens -->
    <path fill="#7a5130" d="M60 14 C74 14 83 23 84 36 C77 24 69 21 60 21 C51 21 43 24 36 36 C37 23 46 14 60 14 Z"/>
    <path fill="#fbf0d8" opacity="0.38" d="M37 38 C42 29 51 25 60 25 C69 25 78 29 83 38 L81 41 C76 33 69 30 60 30 C51 30 44 33 39 41 Z"/>
    <ellipse cx="56" cy="27" rx="15" ry="8" fill="url(#gloss)" opacity="0.5"/>
    <circle cx="48" cy="38" r="6.2" fill="#241f31"/>
    <circle cx="50.1" cy="35.9" r="1.9" fill="#ffffff" opacity="0.9"/>
    <circle cx="69" cy="38" r="6.2" fill="#241f31"/>
    <circle cx="71.1" cy="35.9" r="1.9" fill="#ffffff" opacity="0.9"/>
  </g>
  </g>
  </g>
