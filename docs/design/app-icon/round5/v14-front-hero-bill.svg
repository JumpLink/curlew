<!--
V14 – V10 with the bill painted the way Adium paints its beak: thicker than life, a pale
rim so it never merges with the bird, a hard highlight along the upper mandible, a wide
pale lower mandible and a dark tip. Longer than a real curlew's, on purpose: at 32 px the
only question is whether the sickle is still a sickle.
-->
