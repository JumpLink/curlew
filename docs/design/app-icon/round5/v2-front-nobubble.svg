  <path fill="#a8835c" opacity="0.75" d="M59.56 47.43 L61.49 49.20 L63.38 51.02 L65.21 52.89 L67.00 54.80 L68.72 56.77 L70.40 58.78 L72.01 60.84 L73.57 62.94 L75.07 65.10 L76.50 67.30 L77.88 69.55 L79.18 71.85 L80.42 74.20 L81.59 76.60 L82.70 79.04 L83.73 81.54 L84.68 84.08 L85.56 86.68 L86.37 89.32 L87.09 92.02 L84.70 92.55 L83.83 89.98 L82.90 87.46 L81.91 85.00 L80.86 82.60 L79.75 80.25 L78.59 77.95 L77.36 75.69 L76.09 73.49 L74.76 71.33 L73.38 69.22 L71.95 67.15 L70.47 65.13 L68.94 63.14 L67.36 61.20 L65.73 59.30 L64.05 57.45 L62.33 55.63 L60.55 53.86 L58.74 52.12 L56.88 50.43 Z"/>
  <path fill="#2a1c10" d="M91.75 92.81 L92.00 95.42 L92.17 98.05 L92.24 100.71 L92.23 103.38 L92.13 106.08 L91.93 108.80 L91.65 111.53 L91.27 114.28 L90.80 117.05 L89.20 116.95 L89.00 114.21 L88.73 111.52 L88.40 108.88 L88.01 106.30 L87.55 103.76 L87.05 101.28 L86.48 98.85 L85.86 96.47 L85.19 94.14 Z"/>
  <path fill="#ffffff" opacity="0.17" d="M60.80 43.56 L62.79 45.32 L64.73 47.14 L66.62 49.01 L68.45 50.94 L70.23 52.91 L71.95 54.94 L73.61 57.02 L75.20 59.15 L76.73 61.33 L78.20 63.56 L79.59 65.84 L80.91 68.17 L82.16 70.55 L83.34 72.98 L84.43 75.45 L85.45 77.97 L86.38 80.53 L87.23 83.14 L89.61 82.35 L88.84 79.62 L87.97 76.94 L87.01 74.30 L85.96 71.70 L84.81 69.16 L83.58 66.66 L82.27 64.21 L80.87 61.82 L79.40 59.48 L77.85 57.19 L76.22 54.96 L74.53 52.79 L72.77 50.67 L70.94 48.61 L69.05 46.61 L67.11 44.66 L65.11 42.77 L63.05 40.95 Z"/>
  <g transform="rotate(-10 60 38)">
    <!-- the same ellipse 3 px lower, a crescent of shade that lifts the head off the back -->
    <ellipse cx="60" cy="39" rx="24" ry="22" fill="#8a5f3a" opacity="0.4"/>
    <ellipse cx="60" cy="36" rx="24" ry="22" fill="url(#buff)"/>
    <!-- dark crown with the pale central stripe a curlew has, and the supercilium
         over each eye: the marks that still say curlew when the bill foreshortens -->
    <path fill="#7a5130" d="M60 14 C74 14 83 23 84 36 C77 24 69 21 60 21 C51 21 43 24 36 36 C37 23 46 14 60 14 Z"/>
    <path fill="#fbf0d8" opacity="0.38" d="M37 38 C42 29 51 25 60 25 C69 25 78 29 83 38 L81 41 C76 33 69 30 60 30 C51 30 44 33 39 41 Z"/>
    <ellipse cx="56" cy="27" rx="15" ry="8" fill="url(#gloss)" opacity="0.5"/>
    <circle cx="48" cy="38" r="6.2" fill="#241f31"/>
    <circle cx="50.1" cy="35.9" r="1.9" fill="#ffffff" opacity="0.9"/>
    <circle cx="69" cy="38" r="6.2" fill="#241f31"/>
    <circle cx="71.1" cy="35.9" r="1.9" fill="#ffffff" opacity="0.9"/>
  </g>
  </g>
</svg>
