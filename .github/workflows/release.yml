name: Release

# A tag is a release: `git tag v<version> && git push --tags` builds every target, runs the whole
# of CI, and hangs the installable packages off the tag as a DRAFT release (notes from the tag's
# CHANGELOG section, plus SHA256SUMS); publishing it is a manual step. The build itself is NOT repeated
# here — the `build` job below calls .github/workflows/ci.yml, so there is exactly one definition
# of how the toolchain is installed and what "green" means. A release therefore cannot be cut from
# a commit whose tests, type check or lint did not pass.
#
# The CLI's own packages are built there too, not here: ci.yml ships `ship-deb-rpm` (`.deb`,
# `.rpm`) and `ship-macos` (`.zip` + `.dmg` per arch, signed and notarised) and `ship-windows` (`windows-dir-zip` + `.msi`) as uploaded
# artifacts, and the `release` job below only attaches them. Both assemble on the SAME
# `fedora:44` container: `gjsify ship`'s darwin/windows targets are not host-bound to assemble,
# only to run, so `gjsify install --os darwin --cpu arm64 --immutable` followed by `gjsify ship
# darwin --arch arm64 --skip-build --target macos-app-zip` on that same container is the whole
# difference — no second toolchain.
#
# The Flatpak is built by ci.yml's `flatpak` job and ships as the `ship-flatpak` artifact. It has
# no GOA hole, by decision: it is the chat client (docs/adr/0011-same-app-inside-and-outside-a-sandbox.md).
on:
  push:
    tags: ['v*']
  # Re-cut assets for a tag that already exists, without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build from (e.g. v0.2.0). Empty = the selected branch."
        required: false
        default: ""
        type: string
      publish:
        description: "Attach the artifacts to the GitHub release (needs a tag)"
        required: false
        default: false
        type: boolean

# Two tags pushed seconds apart would otherwise run twice against one release and upload in
# whichever order finished last. Queued rather than cancelled: a half-uploaded release is worse
# than a slow one.
concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    # A branch dispatch signs too when the secrets are there, so signing is rehearsed before a tag;
    # only a release REQUIRES them.
    with:
      sign: true
      release: ${{ startsWith(github.ref, 'refs/tags/v') || (inputs.publish && inputs.tag != '') }}
    secrets: inherit

  release:
    needs: build
    # A dispatch without `publish` builds and stops: the name it would attach to is a branch, not
    # necessarily a release, so `inputs.publish` alone is not enough on its own.
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (inputs.publish && inputs.tag != '') }}
    # Only this job needs the token; the build above needs nothing but the checkout.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # The tag's own sources: app/package.json names the packages, CHANGELOG.md and the extract
      # script give the notes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: src

      # THREE artifacts, not one: `.deb` + `.rpm` and the macOS/Windows packages come out of the
      # same container that already ran the bridge's tests, and merging them into a single upload
      # would mean a partial job failure losing the other half silently.
      - name: Fetch the CLI packages CI built
        uses: actions/download-artifact@v4
        with:
          pattern: ship-*
          merge-multiple: true
          path: cli

      # Each file named individually, not just a directory check: a cli/ holding SOME files would
      # pass a non-empty check and still let `gh release create` publish an incomplete release.
      # Names are the ones ci.yml's own asserts use: the version in app/package.json, not the tag.
      # A prerelease tag (`v0.2.0-rc.1`) builds the same `0.2.0` packages, so the tag only has to
      # match that version up to its `-` suffix; a tag naming another version is refused.
      - name: Assert every artifact arrived
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          ls -la cli
          version=$(node -p "require('./src/app/package.json').version")
          base="${TAG#v}"
          base="${base%%-*}"
          if [ "$base" != "$version" ]; then
            echo "::error::tag $TAG does not match app/package.json version $version"
            exit 1
          fi
          missing=0
          for f in \
            "cli/curlew_${version}-1_amd64.deb" \
            "cli/curlew-${version}-1.x86_64.rpm" \
            "cli/curlew-${version}-1.macos.arm64.zip" \
            "cli/curlew-${version}-1.macos.x86_64.zip" \
            "cli/curlew-${version}-1.arm64.dmg" \
            "cli/curlew-${version}-1.x86_64.dmg" \
            "cli/curlew-${version}-1.windows.x64.zip" \
            "cli/curlew-${version}-1.x64.msi" \
            "cli/eu.jumplink.curlew-${version}-1.x86_64.flatpak"; do
            if [ ! -s "$f" ] || [ ! -s "$f.gjsify-release.json" ]; then
              echo "::error::missing or empty artifact or release record: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Write the release notes and checksums
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          src/scripts/changelog-section.sh "$TAG" src/CHANGELOG.md > notes.md
          (cd cli && sha256sum -- * | grep -v -e ' SHA256SUMS$' -e '\.gjsify-release\.json$' > SHA256SUMS)
          cat cli/SHA256SUMS

      # A DRAFT: nobody can download an artifact before the maintainer has looked at the release
      # page and published it by hand. A re-run on an existing release replaces assets and notes
      # instead of failing, because `gh release create` refuses a tag that already has a release.
      - name: Attach everything to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          ls -la cli
          [ -n "$(ls -A cli)" ] || { echo "::error::no CLI packages were downloaded"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" cli/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            # A `-rc.N` style tag is marked as a prerelease, so it never shows as the latest one.
            pre=""
            case "$TAG" in *-*) pre="--prerelease" ;; esac
            gh release create "$TAG" cli/* --draft $pre --title "$TAG" --notes-file notes.md
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'

      # macOS (arm64 + x64, `.zip` + `.dmg`) and Windows (x64, `windows-dir-zip` + `.msi`)
      # are attached from `cli/` above. Both assemble on Linux; macOS is only packed on a Mac,
      # because `codesign`, `notarytool` and `hdiutil` exist nowhere else (ci.yml's `macos` job).
      # That job signs with a Developer ID, notarises, staples the `.dmg` and checks each package
      # against Gatekeeper; a tag run FAILS without the five APPLE_* secrets instead of publishing
      # unsigned, and a branch dispatch rehearses signing when they are there.
      # These packages ship with EVERY account backend unavailable that needs GOA or EDS (Linux-only
      # GObject-Introspection libraries the `--app node` bundle cannot load) — see README.md.
      #
      # Windows is still UNSIGNED (the signing service is not validated yet): SmartScreen warns.
