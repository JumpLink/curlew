name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml's `build` job calls this file, so a tag is built and tested by ONE definition of
  # the toolchain. Without `workflow_call` here the call is INVALID — a reusable workflow must
  # declare it (docs: "For a workflow to be reusable, the values in `on` must include
  # `workflow_call`"), and the release run would fail before its first step.
  workflow_call:
    inputs:
      sign:
        description: "Sign and notarise the macOS packages when the Apple secrets are there"
        type: boolean
        default: false
      release:
        description: "This run is a release: signing is then required, not just attempted"
        type: boolean
        default: false

# Node-free gjsify toolchain (mirrors the buchhaltung/bauplaner CI). Everything runs on the
# gjsify stack pinned in app/package.json: `gjsify install --immutable` (from gjsify-lock.json),
# the bundled `gjsify tsc` type-check, `gjsify build` for the CLI bundle, and the test bundle
# under both gjs and node. Node is present only to bootstrap the gjsify CLI (its published bin
# is Node; its work targets gjs).
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      # These are load-bearing, unlike in the sibling projects. @curlew/gnome does
      # TOP-LEVEL STATIC `gi://` imports (Goa, EDataServer, EBook, ECal), so the bundle needs
      # those typelibs at MODULE LOAD, not merely when a call is made — without them CI cannot
      # even import what it just built. libgda-sqlite backs `node:sqlite` for the index.
      # openssl is the TLS tests' certificate authority: `tls.spec.ts` and `signal.test.ts` mint a
      # throwaway self-signed root per run with it, because a certificate that is an INERT stub
      # would not prove that `ca` is honoured. Without the binary those tests fail on `spawn
      # openssl ENOENT` — a red run that says nothing about the code.
      # msitools adds `wixl`, the Linux-side MSI compiler `gjsify ship windows --target msi`
      # needs (ADR 0024 § M5 in gjsify): a Fedora package, not a download.
      # gettext is `msgfmt`, which `build` runs over `po/` into `dist/locale`. The compile step
      # only warns when it is missing — but `gjsify ship` then REFUSES a `gjsify.ship.localeDir`
      # with no `.mo` in it, so without this the packaging steps below fail instead.
      - name: Install system prerequisites (gjs + GOA/EDS typelibs + libgda + openssl + msitools + gettext)
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gjs
          gnome-online-accounts evolution-data-server
          libgda libgda-sqlite
          openssl
          msitools
          gettext

      - uses: actions/checkout@v4

      # Node 24 to bootstrap + run the gjsify CLI. gjsify's native install-backend prebuilds
      # target node 24 — Fedora's default node 22 loads a mismatched ABI and segfaults
      # `gjsify install`.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Content-addressed tarball store: a warm cache lets `gjsify install --immutable` skip
      # the download phase. Keyed on the lockfile.
      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: gjsify-tarballs-

      # Bootstrap the gjsify CLI so `gjsify install` is runnable before node_modules exists.
      # It must be the SAME version the deps pin — a global-CLI ↔ pinned-libs mismatch produces
      # broken bundles. Read that version out of app/package.json rather than repeating it:
      # hardcoded, it silently fell behind in a sibling project when the pin moved.
      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          echo "Bootstrapping @gjsify/cli@$VERSION (from app/package.json)"
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies (gjsify install --immutable)
        run: gjsify install --immutable

      # -A includes `private: true` workspaces. Without it every packages/* is skipped and the
      # type-check silently covers only the app.
      - name: Type check (app + every package)
        run: gjsify foreach -A check

      # Neither runs anywhere else: unformatted files once reached main because only the type
      # check was here. Both exit non-zero on a finding.
      - name: Format check
        run: gjsify workspace curlew-cli format:check

      - name: Lint
        run: gjsify workspace curlew-cli lint

      # Hard gate: a fuzzy or untranslated entry, or a catalogue that no longer matches the
      # sources, fails here. The same checks per entry run as a test (po-catalogue.test.ts).
      - name: Check the translation catalogue
        run: |
          ./dev/i18n.sh extract
          msgfmt --check --statistics -o /dev/null po/de.po 2>&1 | tee /tmp/msgfmt.txt
          if grep -qE 'fuzzy|unübersetzt|untranslated' /tmp/msgfmt.txt; then exit 1; fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # POT-Creation-Date changes on every run; any other difference means a stale catalogue.
          git diff --exit-code -I'^"POT-Creation-Date' -- po/

      - name: Check the screenshot references
        run: ./dev/check-screenshot-refs.sh

      - name: Build the CLI bundle
        run: gjsify workspace curlew-cli build

      # The Flatpak job below packs THIS build rather than making its own: its container has no
      # `msgfmt`, and `gjsify ship` refuses a locale directory without a `.mo`. Uploaded before
      # the tests run, so the test bundles they write into `dist/` never travel with it.
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: |
            app/dist/curlew.gjs.mjs
            app/dist/window.gjs.mjs
            app/dist/locale
          retention-days: 1

      # Copies the bundle just built out of the tree and asks it to load libsignal from there.
      # It proves whether a built curlew is RELOCATABLE — right now it is not: `--app gjs`
      # bakes the ABSOLUTE prebuild path of the native addon into the bundle, so a build can only
      # ever be used on the machine and path that produced it. Since libsignal loads on first use,
      # that failure is late (the bundle starts, the first Signal command dies), and every other
      # check here runs the bundle from inside the tree, where the baked path is correct by
      # accident. Today this step reports a KNOWN GAP and exits 0; it becomes a real assertion
      # when gjsify stops baking the path in, and goes red if an absolute addon path ever
      # reappears in the bundle. It contacts no server and reads no account.
      - name: Bundle relocation probe (native addon, out of tree)
        run: gjsify workspace curlew-cli test:relocation

      # Runs on gjs AND node. There is no session D-Bus here, so GOA/EDS are unreachable —
      # that is expected and is what the three-state availability probe is for. The tests
      # assert the backend reports itself unavailable cleanly; they never assert a live call
      # succeeded. The limit is for a HANG: a blocked GI call under node-gi once left this step
      # running until GitHub's 6-hour cancel. The suite takes ~2 minutes.
      - name: Tests (gjs + node)
        timeout-minutes: 15
        run: gjsify workspace curlew-cli test

      # The read-only gate, asserted END-TO-END rather than against a stub. The unit suite tests
      # `applyReadOnlyGate` through a fake recorder, which cannot see the failure that matters
      # most here: the gate works by wrapping `McpServer.registerTool`, so if the SDK ever stops
      # routing registrations through that method the wrapper becomes a no-op and every unit test
      # still passes. This drives the real bundle over real stdio and asserts on the wire.
      #
      # It needs no session bus: GOA is unreachable in this container and the script tolerates
      # that (it asserts a well-formed answer, not a successful one).
      - name: MCP end-to-end + read-only gate (real stdio)
        run: gjsify workspace curlew-cli test:mcp

      # The CLI's own installable artifacts, out of the same bundle the tests above ran against.
      # `.deb` and `.rpm` only here — gjsify writes both itself and execs nothing for them, so this
      # step needs no tool this job does not already install. The Flatpak is the `flatpak` job
      # below, in a container that carries `flatpak-builder` and the GNOME runtime (ADR 0011).
      #
      # `ship` stages every file in `dist/`, and the tests have just written their own bundles
      # there (`test.*`, `*-dbus.gjs.mjs`) — they would ride along in the package. Only what the
      # app runs is kept.
      - name: Keep only the app bundles in dist
        run: find app/dist -maxdepth 1 -type f ! -name curlew.gjs.mjs ! -name window.gjs.mjs -delete

      - name: Package the bridge (.deb + .rpm)
        working-directory: app
        run: gjsify ship linux --skip-build --target deb,rpm

      # `ship` exits 0 after writing NOTHING when every target is filtered away, so each file is
      # asserted by name rather than assumed. `amd64` and `x86_64`, not `all`/`noarch`: the bundle
      # carries the linux-x64 native prebuilds (`gjsify.ship.bundledTypelibs`), so the packages
      # are for that architecture only, which is also what lets apt/dnf refuse them elsewhere.
      - name: Assert the two packages arrived
        working-directory: app/ship/out
        run: |
          set -eu
          ls -la
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          for f in "curlew_${version}-1_amd64.deb" "curlew-${version}-1.x86_64.rpm"; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty artifact: $f"
              exit 1
            fi
          done

      # The Flatpak's first half. `ship` renders the app icon into the sizes a Flatpak needs
      # through `gjs`, which this job has and the Flatpak container (Freedesktop SDK) does not, so
      # the payload is assembled here and only PACKED there (`--from-stage`, ADR 0024 § A2). It has
      # to happen now: the macOS/Windows installs below swap the native prebuilds in
      # `node_modules`, and the Linux ones are what the stage copies. Tarred because an artifact
      # upload drops file modes, and the launcher has to stay executable.
      - name: Stage the Flatpak payload
        working-directory: app
        run: gjsify ship linux --skip-build --stage --target flatpak

      - name: Tar the Flatpak stage
        run: tar -C app/ship -cf flatpak-stage.tar stage

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-stage
          path: flatpak-stage.tar
          retention-days: 1
          compression-level: 0

      # The `.deb`/`.rpm` above are built from `build` (`build:gjs`), but `gjsify.ship.bundle.darwin`
      # and `.win32` point at `dist/curlew.node.mjs` — a bundle NOTHING above builds, and
      # `--skip-build` tells `ship` not to build it either. Measured on 0.54.0: without this step
      # every `Ship darwin`/`Ship windows` step exits 1 with "the bundle dist/curlew.node.mjs does
      # not exist". One extra build of the same sources through `--app node`.
      - name: Build the node bundle (macOS/Windows payloads)
        run: gjsify workspace curlew-cli build:node

      # macOS and Windows runtimes are `optionalDependencies` gated by os/cpu, which a plain install
      # on this Linux host SKIPS — naming the target installs it instead, and `ship` picks up both
      # that runtime and the matching `@gjsify/node-gi` native addon from node_modules at pack time.
      # Assembly is not host-bound (ADR 0024 § A1): the Mach-O and PE payloads are only VERIFIED on
      # their own OS — a Mac or a Windows runner would be for that, not assembled on one. The `node`
      # bundle they ship has no `gi://`, so GOA/EDS are unavailable there: these packages offer the
      # chat protocols only, and the app hides mail (`app/src/core/platform.ts`, see README.md's
      # Releasing section) — the Linux `.deb`/`.rpm` above is the only package with mail.
      # `codesign`, `notarytool` and `hdiutil` exist only on a Mac, so macOS is only STAGED here and
      # the `macos` job below packs, signs and notarises it. `--from-stage` is the split: a stage
      # carries its own closure and needs no project on the other side. Tarred because
      # `upload-artifact` drops the executable bit and flattens symlinks, and a `.app` with either
      # gone does not launch.
      - name: Stage macOS (arm64 + x64)
        run: |
          set -eu
          for arch in arm64 x64; do
            gjsify install --os darwin --cpu "$arch" --immutable
            (cd app && gjsify ship darwin --arch "$arch" --skip-build --stage \
              --target macos-app-zip,macos-app-dmg --out "ship/stage-$arch")
            tar -C "app/ship/stage-$arch" -cf "macos-stage-$arch.tar" stage
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-stage
          path: macos-stage-*.tar
          retention-days: 1
          compression-level: 0

      # `msi` needs `wixl` (msitools, installed above); `windows-dir-zip` needs nothing `ship` does
      # not write itself.
      - name: Package Windows (x64)
        run: gjsify install --os win32 --cpu x64 --immutable

      - name: Ship Windows (x64)
        working-directory: app
        run: gjsify ship windows --arch x64 --skip-build --target windows-dir-zip,msi

      - name: Assert the Windows artifacts arrived
        working-directory: app/ship/out
        run: |
          set -eu
          ls -la
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          for f in \
            "curlew-${version}-1.windows.x64.zip" \
            "curlew-${version}-1.x64.msi"; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty artifact: $f"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ship-deb-rpm
          path: |
            app/ship/out/*.deb
            app/ship/out/*.rpm
          # Already-compressed packages; the default level 6 would spend minutes re-compressing
          # them on the way up and again on the way down for no gain.
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: ship-windows
          path: |
            app/ship/out/*.zip
            app/ship/out/*.msi
          compression-level: 0

  # The same app inside a sandbox (ADR 0011). The payload was staged in `build-and-test`; this job
  # packs it. `gjsify ship --from-stage --target flatpak` writes the manifest from the settings
  # the stage recorded (`gjsify.ship.flatpak` in app/package.json) and runs `flatpak-builder` in
  # the container Flathub's own CI uses, which carries it and the GNOME runtime.
  # `--privileged` because flatpak-builder runs bubblewrap, which needs user namespaces.
  flatpak:
    needs: build-and-test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: flatpak-stage

      - name: Unpack the stage
        run: mkdir -p app/ship && tar -C app/ship -xf flatpak-stage.tar

      # `--from-stage` needs the CLI and nothing of the project: no install, no node_modules.
      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          npm install -g "@gjsify/cli@$VERSION"

      - name: Package the Flatpak
        working-directory: app
        run: gjsify ship --from-stage ship/stage --expect-target linux-x64 --target flatpak

      - name: Assert the bundle arrived
        working-directory: app/ship/out
        run: |
          set -eu
          ls -la
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          f="eu.jumplink.curlew-${version}-1.x86_64.flatpak"
          if [ ! -s "$f" ]; then
            echo "::error::missing or empty artifact: $f"
            exit 1
          fi

      # What the build cannot show: the natives the bundle loads at run time are inside the
      # sandbox. `conversations list` opens the index (SQLite) and starts the bridge stack; a
      # missing typelib in the bundle fails here and nowhere earlier.
      - name: Smoke test inside the sandbox
        working-directory: app/ship/out
        run: |
          set -eu
          flatpak install --system -y --noninteractive --bundle eu.jumplink.curlew-*.flatpak
          flatpak run --command=curlew eu.jumplink.curlew --version
          flatpak run --command=curlew eu.jumplink.curlew conversations list
          # ADR 0016 needs libportal: prove the GNOME runtime ships the Xdp typelib.
          flatpak run --command=gjs eu.jumplink.curlew -c "imports.gi.versions.Xdp='1.0'; imports.gi.Xdp; print('Xdp ok')"

      # Findings go to the job log; they do not fail the job yet (Flathub readiness, B1).
      - name: Find the generated manifest
        id: manifest
        run: |
          set -eu
          m=$(find app/ship -name 'eu.jumplink.curlew*.json' -o -name 'eu.jumplink.curlew*.y*ml' | grep -v '/stage/' | head -1)
          echo "manifest: ${m:-none}"
          echo "path=$m" >> "$GITHUB_OUTPUT"
          r=$(find app/ship -type d -name repo | head -1)
          echo "repo: ${r:-none}"
          echo "repo=$r" >> "$GITHUB_OUTPUT"

      - name: Lint the manifest and the repo (informational)
        continue-on-error: true
        run: |
          command -v flatpak-builder-lint || echo "flatpak-builder-lint missing"
          if [ -n "${{ steps.manifest.outputs.path }}" ]; then
            flatpak-builder-lint manifest "${{ steps.manifest.outputs.path }}" || true
          fi
          if [ -n "${{ steps.manifest.outputs.repo }}" ]; then
            flatpak-builder-lint repo "${{ steps.manifest.outputs.repo }}" || true
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ steps.manifest.outputs.path != '' }}
        with:
          name: flatpak-manifest
          path: ${{ steps.manifest.outputs.path }}

      - uses: actions/upload-artifact@v4
        with:
          name: ship-flatpak
          path: app/ship/out/*.flatpak
          compression-level: 0

  # ── macOS: pack, sign and notarise ───────────────────────────────────────────────────────────
  # Packs the stages above into a `.zip` and a `.dmg` per arch. The identity is a Developer ID
  # Application certificate (direct distribution), the notary credential an App Store Connect API
  # key. Repo secrets:
  #   APPLE_DEVELOPER_ID_P12_BASE64   the certificate + private key, `base64 -w0`
  #   APPLE_DEVELOPER_ID_P12_PASSWORD its export password
  #   APPLE_NOTARY_KEY_P8             the `AuthKey_<id>.p8` file, as text
  #   APPLE_NOTARY_KEY_ID             the key id
  #   APPLE_NOTARY_ISSUER_ID          the issuer UUID
  # Read only when the caller passes `sign` (release.yml does): a push or a PR packs UNSIGNED, which
  # still proves the stage packs on macOS without four notary submissions per commit. A RELEASE does
  # not run without them: an unsigned `.app` is refused by Gatekeeper on every Mac.
  macos:
    name: macOS packages
    needs: build-and-test
    runs-on: macos-latest
    env:
      P12_BASE64: ${{ inputs.sign && secrets.APPLE_DEVELOPER_ID_P12_BASE64 || '' }}
      P12_PASSWORD: ${{ inputs.sign && secrets.APPLE_DEVELOPER_ID_P12_PASSWORD || '' }}
      NOTARY_KEY_P8: ${{ inputs.sign && secrets.APPLE_NOTARY_KEY_P8 || '' }}
      NOTARY_KEY_ID: ${{ inputs.sign && secrets.APPLE_NOTARY_KEY_ID || '' }}
      NOTARY_ISSUER_ID: ${{ inputs.sign && secrets.APPLE_NOTARY_ISSUER_ID || '' }}
    steps:
      # All five or none: a partial set packs unsigned with a notice naming what is missing,
      # rather than failing half-way through the keychain import. A release fails instead.
      - name: Decide whether to sign
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -eu
          missing=""
          for v in P12_BASE64 P12_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || missing="$missing $v"
          done
          if [ -z "$missing" ]; then
            echo "CAN_SIGN=1" >> "$GITHUB_ENV"
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::a release needs the secrets behind:$missing"
            exit 1
          else
            echo "::notice::not signing, missing:$missing"
          fi

      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The same version that assembled the stage — the CLI warns when the two phases differ,
      # because a version difference can change the artifact's bytes.
      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          npm install -g "@gjsify/cli@$VERSION"

      - name: Download the macOS stages
        uses: actions/download-artifact@v4
        with:
          name: macos-stage

      # A throwaway keychain, unlocked for the job. `codesign` cannot prompt on a runner, so the
      # key's partition list is opened to it up front; without that the signature fails with
      # errSecInternalComponent. It is also the DEFAULT keychain because `notarytool` reads the
      # default one and gjsify passes it no `--keychain`.
      - name: Import the signing identity
        if: ${{ env.CAN_SIGN == '1' }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(openssl rand -base64 24)
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/identity.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in the .p12"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Store the notary credential
        if: ${{ env.CAN_SIGN == '1' }}
        run: |
          set -eu
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials gjsify-notary \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Pack the macOS zips and dmgs
        run: |
          set -eu
          if [ -z "${SIGN_IDENTITY:-}" ]; then
            echo "::notice::not signing — packing UNSIGNED macOS packages"
            sign=""
          else
            sign="--sign $SIGN_IDENTITY --notarize gjsify-notary"
          fi
          mkdir out
          for arch in arm64 x64; do
            mkdir "pack-$arch"
            tar -C "pack-$arch" -xf "macos-stage-$arch.tar"
            # shellcheck disable=SC2086
            gjsify ship --from-stage "pack-$arch/stage" --expect-target "darwin-$arch" \
              --target macos-app-zip,macos-app-dmg --out "ship-$arch" $sign
            cp "ship-$arch"/out/*.zip "ship-$arch"/out/*.dmg out/
          done
          ls -la out

      # Asserted by name because `ship` exits 0 after writing nothing when every target is filtered
      # away. macOS labels x64 as `x86_64`. Signed, each `.app` and each `.dmg` is judged by
      # Gatekeeper with the quarantine bit a browser download carries: a signed-but-not-notarised
      # app passes `codesign --verify` and is refused there. Unsigned, the dmg is still mounted
      # to prove it holds the app.
      - name: Assert and check the macOS packages
        run: |
          set -eu
          missing=0
          version=$(node -p "require('./app/package.json').version")
          for arch in arm64 x86_64; do
            zip="out/curlew-$version-1.macos.$arch.zip"
            dmg="out/curlew-$version-1.$arch.dmg"
            for f in "$zip" "$dmg"; do
              if [ ! -s "$f" ]; then
                echo "::error::missing or empty artifact: $f"
                missing=1
              fi
            done
            [ "$missing" -eq 0 ] || continue
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
            ls -d "$mnt"/*.app || { echo "::error::the $arch dmg holds no .app"; missing=1; }
            hdiutil detach "$mnt" >/dev/null
            [ -n "${SIGN_IDENTITY:-}" ] || continue
            [ "$missing" -eq 0 ] || continue
            quarantine="0083;$(printf %x "$(date +%s)");Safari;"
            check="check-$arch"
            rm -rf "$check" && mkdir "$check"
            ditto -x -k "$zip" "$check"
            app=$(ls -d "$check"/*.app)
            codesign --verify --deep --strict "$app"
            xattr -w com.apple.quarantine "$quarantine" "$app"
            spctl --assess --type execute -vv "$app" 2>&1 | tee "$check.log"
            grep -q "source=Notarized Developer ID" "$check.log" || {
              echo "::error::curlew $arch is signed but Gatekeeper does not see it as notarised"
              missing=1
            }
            xcrun stapler validate "$dmg"
            xattr -w com.apple.quarantine "$quarantine" "$dmg"
            spctl --assess --type open --context context:primary-signature -vv "$dmg" 2>&1 | tee "$check.log"
            grep -q "source=Notarized Developer ID" "$check.log" || {
              echo "::error::the curlew $arch dmg is not seen as notarised"
              missing=1
            }
            rm -rf "$check" "$check.log"
          done
          [ "$missing" -eq 0 ]

      - name: Remove the signing keychain
        if: ${{ always() && env.CAN_SIGN == '1' }}
        run: |
          security default-keychain -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ship-macos
          path: out/*
          compression-level: 0
          if-no-files-found: error

  # Start every built artifact on the OS it is for. `build-and-test` only ASSEMBLES the macOS and
  # Windows payloads on Linux, and the `.deb`/`.rpm` were never installed anywhere; a file that
  # exists is not a program that starts. Each job unpacks what the packaging job uploaded, runs
  # `--version`, then `conversations list` against an EMPTY home (no account, no daemon, no
  # network): that opens the index and starts the bridge stack, so a missing native or a bad
  # bundle path fails here. The "Open the window" step below proves the window.
  start-macos-windows:
    needs: [build-and-test, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            zip: "*.macos.arm64.zip"
          - os: macos-15-intel
            zip: "*.macos.x86_64.zip"
          - os: windows-latest
            zip: "*.windows.x64.zip"
            msi: "*.x64.msi"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ship-macos
          path: ship

      - uses: actions/download-artifact@v4
        with:
          name: ship-windows
          path: ship

      - name: Unpack
        run: |
          set -eu
          ls -la ship
          mkdir unpacked
          cd ship
          for z in ${{ matrix.zip }}; do
            if [ "$RUNNER_OS" = Windows ]; then
              powershell -NoProfile -Command "Expand-Archive -Path '$z' -DestinationPath '../unpacked'"
            else
              ditto -x -k "$z" ../unpacked
            fi
          done
          find ../unpacked -maxdepth 4 | head -40

      - name: Locate the binary
        run: |
          set -eu
          if [ "$RUNNER_OS" = Windows ]; then
            bin=$(find unpacked -iname 'curlew.exe' | head -1)
          else
            bin=$(find unpacked -path '*/Contents/MacOS/*' -type f -iname 'curlew*' | head -1)
          fi
          if [ -z "$bin" ]; then
            echo "::error::no curlew binary in the unpacked archive"
            exit 1
          fi
          chmod +x "$bin" || true
          echo "CURLEW_BIN=$(cd "$(dirname "$bin")" && pwd)/$(basename "$bin")" >> "$GITHUB_ENV"

      - name: Start the binary (--version, empty index)
        run: |
          set -eu
          home=$(mktemp -d)
          export HOME="$home" USERPROFILE="$home" XDG_CONFIG_HOME="$home/.config" XDG_DATA_HOME="$home/.local/share" XDG_CACHE_HOME="$home/.cache"
          "$CURLEW_BIN" --version
          "$CURLEW_BIN" conversations list

      # The window, headless-safe: demo data in a scratch directory (no account, no network), the
      # launcher's own no-argument start, and `CURLEW_WINDOW_QUIT_AFTER_MS` so the process ends
      # itself. Fails on a non-zero exit, or when the window never reached the screen.
      - name: Open the window (demo data, quits itself)
        timeout-minutes: 3
        run: |
          set -u
          home=$(mktemp -d)
          export HOME="$home" USERPROFILE="$home" XDG_CONFIG_HOME="$home/.config" XDG_DATA_HOME="$home/.local/share" XDG_CACHE_HOME="$home/.cache"
          export CURLEW_DB_PATH="$home/index.db" CURLEW_CONFIG="$home/config.json" CURLEW_PREVIEWS_DIR="$home/previews" CURLEW_DATA_DIR="$home/data" CURLEW_SECRETS_DIR="$home/secrets" CURLEW_THUMBS_DIR="$home/thumbs" CURLEW_AVATARS_DIR="$home/avatars" CURLEW_NO_HOST_ACCOUNTS=1
          export CURLEW_DEMO=1 CURLEW_WINDOW_QUIT_AFTER_MS=4000
          code=0
          "$CURLEW_BIN" > window.log 2>&1 || code=$?
          cat window.log
          if [ "$code" -ne 0 ]; then
            echo "::error::the window exited with $code"
            exit 1
          fi
          if ! grep -q 'curlew window: shown' window.log; then
            echo "::error::the window never reported being shown"
            exit 1
          fi

      # The Windows installer, not only the zip: install quietly, then start what it installed.
      - name: Install the MSI and start the installed binary
        if: runner.os == 'Windows'
        run: |
          set -eu
          msi=$(ls ship/${{ matrix.msi }} | head -1)
          powershell -NoProfile -Command "\$p = Start-Process msiexec.exe -ArgumentList '/i','$(cygpath -w "$PWD/$msi")','/qn','/l*v','msi.log' -Wait -PassThru; exit \$p.ExitCode" || { tail -50 msi.log; exit 1; }
          bin=$(find "/c/Program Files" "/c/Program Files (x86)" "$LOCALAPPDATA" -iname 'curlew.exe' 2>/dev/null | head -1)
          if [ -z "$bin" ]; then
            echo "::error::the MSI installed no curlew.exe"
            tail -50 msi.log
            exit 1
          fi
          home=$(mktemp -d)
          export HOME="$home" USERPROFILE="$home"
          "$bin" --version
          "$bin" conversations list

  # The Linux packages in the distributions they target. `apt`/`dnf` resolve the declared
  # dependencies, which is half of what is being tested.
  start-linux-packages:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:testing
            install: apt-get update -qq && apt-get install -y ./curlew_*.deb
          - image: ubuntu:26.04
            install: apt-get update -qq && apt-get install -y ./curlew_*.deb
          - image: fedora:latest
            install: dnf install -y ./curlew-*.rpm
    runs-on: ubuntu-latest
    # The packages need gjs >= 1.86 (GNOME 49), so the oldest images that can install them are
    # Debian testing and Ubuntu 26.04; Debian stable and Ubuntu 24.04 cannot.
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ship-deb-rpm
          path: pkg

      - name: Install the package
        working-directory: pkg
        run: |
          set -eu
          ls -la
          ${{ matrix.install }}

      - name: Start the installed binary (--version, empty index)
        run: |
          set -eu
          home=$(mktemp -d)
          export HOME="$home" XDG_CONFIG_HOME="$home/.config" XDG_DATA_HOME="$home/.local/share" XDG_CACHE_HOME="$home/.cache"
          curlew --version
          curlew conversations list
