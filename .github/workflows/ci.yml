name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml's `build` job calls this file, so a tag is built and tested by ONE definition of
  # the toolchain. Without `workflow_call` here the call is INVALID — a reusable workflow must
  # declare it (docs: "For a workflow to be reusable, the values in `on` must include
  # `workflow_call`"), and the release run would fail before its first step.
  workflow_call:

# Node-free gjsify toolchain (mirrors the buchhaltung/bauplaner CI). Everything runs on the
# gjsify stack pinned in app/package.json: `gjsify install --immutable` (from gjsify-lock.json),
# the bundled `gjsify tsc` type-check, `gjsify build` for the CLI bundle, and the test bundle
# under both gjs and node. Node is present only to bootstrap the gjsify CLI (its published bin
# is Node; its work targets gjs).
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      # These are load-bearing, unlike in the sibling projects. @curlew/gnome does
      # TOP-LEVEL STATIC `gi://` imports (Goa, EDataServer, EBook, ECal), so the bundle needs
      # those typelibs at MODULE LOAD, not merely when a call is made — without them CI cannot
      # even import what it just built. libgda-sqlite backs `node:sqlite` for the index.
      # openssl is the TLS tests' certificate authority: `tls.spec.ts` and `signal.test.ts` mint a
      # throwaway self-signed root per run with it, because a certificate that is an INERT stub
      # would not prove that `ca` is honoured. Without the binary those tests fail on `spawn
      # openssl ENOENT` — a red run that says nothing about the code.
      # msitools adds `wixl`, the Linux-side MSI compiler `gjsify ship windows --target msi`
      # needs (ADR 0024 § M5 in gjsify): a Fedora package, not a download.
      - name: Install system prerequisites (gjs + GOA/EDS typelibs + libgda + openssl + msitools)
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gjs
          gnome-online-accounts evolution-data-server
          libgda libgda-sqlite
          openssl
          msitools

      - uses: actions/checkout@v4

      # Node 24 to bootstrap + run the gjsify CLI. gjsify's native install-backend prebuilds
      # target node 24 — Fedora's default node 22 loads a mismatched ABI and segfaults
      # `gjsify install`.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Content-addressed tarball store: a warm cache lets `gjsify install --immutable` skip
      # the download phase. Keyed on the lockfile.
      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: gjsify-tarballs-

      # Bootstrap the gjsify CLI so `gjsify install` is runnable before node_modules exists.
      # It must be the SAME version the deps pin — a global-CLI ↔ pinned-libs mismatch produces
      # broken bundles. Read that version out of app/package.json rather than repeating it:
      # hardcoded, it silently fell behind in a sibling project when the pin moved.
      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          echo "Bootstrapping @gjsify/cli@$VERSION (from app/package.json)"
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies (gjsify install --immutable)
        run: gjsify install --immutable

      # -A includes `private: true` workspaces. Without it every packages/* is skipped and the
      # type-check silently covers only the app.
      - name: Type check (app + every package)
        run: gjsify foreach -A check

      - name: Build the CLI bundle
        run: gjsify workspace curlew-cli build

      # Copies the bundle just built out of the tree and asks it to load libsignal from there.
      # It proves whether a built curlew is RELOCATABLE — right now it is not: `--app gjs`
      # bakes the ABSOLUTE prebuild path of the native addon into the bundle, so a build can only
      # ever be used on the machine and path that produced it. Since libsignal loads on first use,
      # that failure is late (the bundle starts, the first Signal command dies), and every other
      # check here runs the bundle from inside the tree, where the baked path is correct by
      # accident. Today this step reports a KNOWN GAP and exits 0; it becomes a real assertion
      # when gjsify stops baking the path in, and goes red if an absolute addon path ever
      # reappears in the bundle. It contacts no server and reads no account.
      - name: Bundle relocation probe (native addon, out of tree)
        run: gjsify workspace curlew-cli test:relocation

      # Runs on gjs AND node. There is no session D-Bus here, so GOA/EDS are unreachable —
      # that is expected and is what the three-state availability probe is for. The tests
      # assert the backend reports itself unavailable cleanly; they never assert a live call
      # succeeded. The limit is for a HANG: a blocked GI call under node-gi once left this step
      # running until GitHub's 6-hour cancel. The suite takes ~2 minutes.
      - name: Tests (gjs + node)
        timeout-minutes: 15
        run: gjsify workspace curlew-cli test

      # The read-only gate, asserted END-TO-END rather than against a stub. The unit suite tests
      # `applyReadOnlyGate` through a fake recorder, which cannot see the failure that matters
      # most here: the gate works by wrapping `McpServer.registerTool`, so if the SDK ever stops
      # routing registrations through that method the wrapper becomes a no-op and every unit test
      # still passes. This drives the real bundle over real stdio and asserts on the wire.
      #
      # It needs no session bus: GOA is unreachable in this container and the script tolerates
      # that (it asserts a well-formed answer, not a successful one).
      - name: MCP end-to-end + read-only gate (real stdio)
        run: gjsify workspace curlew-cli test:mcp

      # The CLI's own installable artifacts, out of the same bundle the tests above ran against.
      # `.deb` and `.rpm` only here — gjsify writes both itself and execs nothing for them, so this
      # step needs no tool this job does not already install. Flatpak is deliberately absent (see
      # the note in README.md's Releasing section): GOA talks to the session bus directly, which a
      # Flatpak sandbox would not reach without a portal this project does not have, so a Flatpak
      # build would silently ship with every account backend unavailable.
      - name: Package the bridge (.deb + .rpm)
        working-directory: app
        run: gjsify ship linux --skip-build --target deb,rpm

      # `ship` exits 0 after writing NOTHING when every target is filtered away, so each file is
      # asserted by name rather than assumed. `all` and `noarch`, not `x86_64`: `isArchIndependent()`
      # is true for a `kind: "cli"` tree of a JS bundle and a launcher, and apt/dnf both refuse a
      # package whose architecture is not the machine's.
      - name: Assert the two packages arrived
        working-directory: app/ship/out
        run: |
          set -eu
          ls -la
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          for f in "curlew_${version}-1_all.deb" "curlew-${version}-1.noarch.rpm"; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty artifact: $f"
              exit 1
            fi
          done

      # The `.deb`/`.rpm` above are built from `build` (`build:gjs`), but `gjsify.ship.bundle.darwin`
      # and `.win32` point at `dist/curlew.node.mjs` — a bundle NOTHING above builds, and
      # `--skip-build` tells `ship` not to build it either. Measured on 0.54.0: without this step
      # every `Ship darwin`/`Ship windows` step exits 1 with "the bundle dist/curlew.node.mjs does
      # not exist". One extra build of the same sources through `--app node`.
      - name: Build the node bundle (macOS/Windows payloads)
        run: gjsify workspace curlew-cli build:node

      # macOS and Windows runtimes are `optionalDependencies` gated by os/cpu, which a plain install
      # on this Linux host SKIPS — naming the target installs it instead, and `ship` picks up both
      # that runtime and the matching `@gjsify/node-gi` native addon from node_modules at pack time.
      # Assembly is not host-bound (ADR 0024 § A1): the Mach-O and PE payloads are only VERIFIED on
      # their own OS — a Mac or a Windows runner would be for that, not assembled on one. The `node`
      # bundle they ship has no `gi://`, so GOA/EDS and every account backend are unavailable there
      # on purpose (see README.md's Releasing section) — the Linux `.deb`/`.rpm` above is the only
      # package with working accounts.
      - name: Package macOS (arm64)
        run: gjsify install --os darwin --cpu arm64 --immutable

      - name: Ship macOS (arm64)
        working-directory: app
        run: gjsify ship darwin --arch arm64 --skip-build --target macos-app-zip

      - name: Package macOS (x64)
        run: gjsify install --os darwin --cpu x64 --immutable

      - name: Ship macOS (x64)
        working-directory: app
        run: gjsify ship darwin --arch x64 --skip-build --target macos-app-zip

      # `msi` needs `wixl` (msitools, installed above); `windows-dir-zip` needs nothing `ship` does
      # not write itself.
      - name: Package Windows (x64)
        run: gjsify install --os win32 --cpu x64 --immutable

      - name: Ship Windows (x64)
        working-directory: app
        run: gjsify ship windows --arch x64 --skip-build --target windows-dir-zip,msi

      - name: Assert the macOS and Windows artifacts arrived
        working-directory: app/ship/out
        run: |
          set -eu
          ls -la
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          for f in \
            "curlew-${version}-1.macos.arm64.zip" \
            "curlew-${version}-1.macos.x86_64.zip" \
            "curlew-${version}-1.windows.x64.zip" \
            "curlew-${version}-1.x64.msi"; do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty artifact: $f"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ship-deb-rpm
          path: |
            app/ship/out/*.deb
            app/ship/out/*.rpm
          # Already-compressed packages; the default level 6 would spend minutes re-compressing
          # them on the way up and again on the way down for no gain.
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: ship-macos-windows
          path: |
            app/ship/out/*.zip
            app/ship/out/*.msi
          compression-level: 0
