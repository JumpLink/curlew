<?xml version="1.0" encoding="UTF-8"?>
<!--
  A portrait crop: head and neck only, large, with the bill as the dominant diagonal.

  Nothing else competes, so the one feature that identifies the species gets the whole frame.
  The head is distinctly wider than the neck below it, which is what stops head and neck from
  merging into one column; the neck runs off the bottom edge so it reads as a crop rather than
  as a small bird floating in space; and the head carries the curlew's own markings — a dark
  crown, a pale stripe over the eye, and fine streaks down the neck.

  Design round 2, candidate C3.
-->
<svg width="122" height="119" viewBox="7 9 122 119" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="buff" x1="8" y1="12" x2="44" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e8c8"/>
      <stop offset="0.55" stop-color="#e2c091"/>
      <stop offset="1" stop-color="#b0804f"/>
    </linearGradient>
    <linearGradient id="bill" x1="70" y1="26" x2="120" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f4d2e"/>
      <stop offset="0.5" stop-color="#4a3420"/>
      <stop offset="1" stop-color="#332315"/>
    </linearGradient>

    <!-- the neck is narrower than the head and leans away, so a jaw line shows -->
    <path id="neck3" d="M30 66 C20 88 18 108 24 128 L56 128 C50 108 51 88 60 68 Z"/>
    <clipPath id="neck3-clip"><use href="#neck3"/></clipPath>
    <ellipse id="head3" cx="44" cy="42" rx="31" ry="27"/>
    <clipPath id="head3-clip"><use href="#head3"/></clipPath>
  </defs>

  <!-- neck, running off the bottom edge, finely streaked the way a curlew's is -->
  <use href="#neck3" fill="url(#buff)"/>
  <!-- the streaks are thin and many: wide ones at this scale read as stitched-on patches -->
  <g clip-path="url(#neck3-clip)" fill="#9a6c42" opacity="0.32">
    <path d="M27 70 l3 1 -5 17 -3 -1 Z"/>
    <path d="M38 72 l3 1 -5 17 -3 -1 Z"/>
    <path d="M49 73 l3 1 -5 17 -3 -1 Z"/>
    <path d="M23 94 l3 1 -5 17 -3 -1 Z"/>
    <path d="M34 96 l3 1 -5 17 -3 -1 Z"/>
    <path d="M45 97 l3 1 -5 17 -3 -1 Z"/>
    <path d="M21 118 l3 1 -3 10 -3 -1 Z"/>
    <path d="M33 120 l3 1 -3 8 -3 -1 Z"/>
  </g>

  <!-- head -->
  <use href="#head3" fill="url(#buff)"/>
  <g clip-path="url(#head3-clip)">
    <!-- the dark crown: when the cap and the buff are close in value the pale stripe below
         becomes the loudest mark and the head reads as a bandaged one -->
    <path fill="#8a5f3a" d="M10 36 C16 20 30 12 45 12 C62 12 73 19 77 31 C57 18 25 21 10 36 Z"/>
    <!-- the pale stripe over the eye, narrow and tapering toward the back of the head -->
    <path fill="#fbf0d8" opacity="0.55" d="M12 41 C29 28 60 28 77 35 L77 39 C57 31 28 34 13 46 Z"/>
  </g>

  <!-- the bill: broad at the face, level at eye height, decurving over its outer half -->
  <path fill="url(#bill)"
        d="M70 29 C95 38 114 62 123 100 L115 102 C106 68 88 47 67 42 Z"/>

  <circle cx="60" cy="35" r="6.6" fill="#241f31"/>
  <circle cx="62.2" cy="32.8" r="2" fill="#ffffff" opacity="0.85"/>
</svg>
