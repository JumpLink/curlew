<?xml version="1.0" encoding="UTF-8"?>
<!-- Curlew symbolic: head, bill and a slim nape running off the bottom edge. Head and bill alone
     read as a comma at 16 px; the nape is what says "bird", so it stays, but narrow — a wide one
     turns the icon into one black mass. The eye is a hole. Fill only. -->
<svg width="16" height="16" viewBox="0 0 16 16" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <g fill="#241f31">
    <path fill-rule="evenodd"
          d="M2.1 5.2 A2.9 2.9 0 1 1 7.9 5.2 A2.9 2.9 0 1 1 2.1 5.2 Z
             M5.05 4.3 A0.85 0.85 0 1 0 6.75 4.3 A0.85 0.85 0 1 0 5.05 4.3 Z"/>
    <path d="M2.9 6.8 C2.4 10 2.6 13 3 15 H5.6 C5.2 12.4 5.4 9.6 6.4 7.2 Z"/>
    <!-- the two edges stay ~1.5 px apart until the last third: a bill that tapers early
         vanishes at 16 px and the whole icon turns into a hook -->
    <path d="M7.3 2.2 C11.3 2.2 14.6 5.2 15 11.6 C13.4 8.2 11.2 5 7.8 4.6 Z"/>
  </g>
</svg>
