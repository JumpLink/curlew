<?xml version="1.0" encoding="UTF-8"?>
<!--
  eu.jumplink.curlew-symbolic — the calling head from the app icon, reduced to one shape.

  At 16 px the bubble outline from the colour icon competes with the head and both go mushy, so
  only the bird is left: a 10 px head circle on the grid from 1,5 to 11,15, the eye punched out
  as a hole with the same winding rule, and the bill rising out of the gape to the top right
  corner. The bill keeps more weight towards the tip than the drawing does, because a tapered
  tip disappears into the antialiasing at this size.
-->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <path fill="#222222" fill-rule="evenodd"
        d="M6 5 A5 5 0 1 0 6 15 A5 5 0 1 0 6 5 Z
           M8.2 5.4 C10.2 3.9 12.6 2.4 15 1 C13.0 2.9 11.8 5.3 10.9 8.4 Z
           M7.6 9.4 A1.3 1.3 0 1 1 7.6 12 A1.3 1.3 0 1 1 7.6 9.4 Z"/>
</svg>
