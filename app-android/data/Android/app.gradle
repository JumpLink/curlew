// You can add your native dependencies here
dependencies {
  // No com.google.android.material: the UI is native Adwaita widgets
  // (@gjsify/adwaita-nativescript) on plain AppCompat/framework views.
  // AndroidX Activity is required by NativeScript for OnBackPressedDispatcher
  implementation 'androidx.activity:activity:1.9.3'
  // node:sqlite on Android (@gjsify/native-sqlite-bridge): the interfaces and the bundled driver
  // (SQLite with FTS5 from the AAR, not the OS image's). 2.6.2 is the floor.
  implementation 'androidx.sqlite:sqlite:2.7.1'
  implementation 'androidx.sqlite:sqlite-bundled:2.7.1'
}

android {
  compileSdkVersion 35
  buildToolsVersion "35"
  // ndkVersion ""

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 35

    // Version Information
    versionCode 1
    versionName "1.0.0"

    generatedDensities = []
  }

  aaptOptions {
    additionalParameters "--no-version-vectors"
  }
}
